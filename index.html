<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NDC Gitiri Banner</title>
<style>
:root{--bg:#f4f4f4;--fg:#222;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--fg:#eee;--card:#262626}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;padding:12px}
.banner{display:flex;background:#fff;width:100%;max-width:1000px;margin:0 auto;border-radius:6px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.logo{flex:0 0 auto;background:#fff;display:flex;align-items:center;padding:.6vw 1vw}
.logo img{width:auto;display:block}
.rest{flex:1;min-width:0;display:flex;flex-direction:column}
.ln{position:relative;overflow:hidden;text-align:center;font-weight:800}.l1{font-weight:900;letter-spacing:.03em;text-shadow:1px 1px 2px rgba(0,0,0,.35)}.l3{font-weight:700}
.ln.shine{animation:sheen var(--shine) linear infinite}
.slide{position:absolute;z-index:1;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap;opacity:0;transform:var(--enter);clip-path:var(--cin);filter:var(--fin);transition:opacity .7s,transform .7s,clip-path .7s,filter .7s}
.slide.on{opacity:1;transform:none;clip-path:inset(0);filter:none}
.slide.out{opacity:0;transform:var(--leave);clip-path:var(--cout);filter:var(--fout)}
.ln{perspective:700px}
.banner.lay-tv{display:block;background:transparent;overflow:visible;box-shadow:none}
.lay-tv .tvgrid{display:grid;grid-template-columns:auto 1fr}
.lay-tv .tvtag{grid-column:2;grid-row:1;justify-self:end;background:#fff;color:#1b2a4e;font-size:clamp(7px,1.2vw,12px);font-weight:600;padding:2px 12px;border-radius:8px 8px 0 0}
.banner .tvlogo{grid-column:1;grid-row:2/4;background:linear-gradient(180deg,#fff,#fde9db);border-radius:14px 0 0 14px;padding:3px 10px;display:flex;align-items:stretch}
.banner .tvlogo img{width:auto;max-width:none;aspect-ratio:1301/1366;object-fit:contain}
.lay-tv .tvl0{grid-column:2;grid-row:2}
.lay-tv .tvl1{grid-column:2;grid-row:3;font-weight:700}
.lay-tv .tvl2{font-weight:400;flex:1;min-width:0}
.lay-tv .tvl0 .slide,.lay-tv .tvl1 .slide{justify-content:flex-start;padding-left:14px}
.lay-tv .tvbottom{grid-column:1/3;grid-row:4;display:flex}
.lay-person .tvgrid{grid-template-columns:auto 1fr auto}
.lay-person .tvbottom{grid-column:2;grid-row:4}
.banner .tvphoto{grid-column:1;grid-row:1/5;align-self:end;background:#fff;border:3px solid #fff;border-radius:14px 0 0 14px;overflow:hidden;display:flex;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.tvphoto img{height:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.ph0{display:flex;align-items:center;justify-content:center;aspect-ratio:4/5;height:100%;background:#cfd6e4;color:#445;font-size:clamp(8px,1.2vw,12px);text-align:center;padding:6px;box-sizing:border-box;font-weight:700}
.banner .tvlogo2{grid-column:3;grid-row:2/5;background:#fff;padding:4px 8px;border-radius:0 14px 14px 0;display:flex;align-items:stretch}
.banner .tvlogo2 img{width:auto;max-width:none;aspect-ratio:1301/1366;object-fit:contain}

.lay-tv .tvtime{background:#20466a;color:#fff;font-size:clamp(7px,1.3vw,13px);font-weight:700;padding:0 10px;margin-left:clamp(20px,9vw,95px);display:flex;align-items:center;white-space:nowrap}

.lay-card{flex-direction:column;max-width:520px}
.lay-card .logo{justify-content:center;padding:14px 10px 6px}
.lay-card .logo img{height:150px!important}
.lay-card .ln{height:68px!important;font-size:22px!important}
.lay-card .slide{white-space:normal;padding:0 10px;line-height:1.15}
.lay-pill{border-radius:999px;background:#fff;padding:3px}
.lay-pill .logo{border-radius:999px;margin-right:2px}
.lay-pill .rest{gap:3px}
.lay-pill .ln{border-radius:999px}
.track{position:absolute;z-index:1;left:0;top:0;bottom:0;display:flex;align-items:center;white-space:nowrap;animation:tick linear infinite}
@keyframes tick{from{transform:translateX(var(--from,100%))}to{transform:translateX(var(--to,-100%))}}

.ln::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0}
.bar-sheen::before{opacity:1;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:300% 100%;animation:barsheen var(--bars,3s) linear infinite;animation-delay:var(--d,0s)}
.bar-stripes::before{opacity:1;background:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 14px,transparent 14px 28px);background-size:56px 56px;animation:barstripes calc(var(--bars,3s)/3) linear infinite}
.bar-breathe::before{background:#fff;animation:barbreathe var(--bars,3s) ease-in-out infinite;animation-delay:var(--d,0s)}
.bar-blink::before{background:#fff;animation:barblink var(--bars,3s) ease-in-out infinite;animation-delay:var(--d,0s)}
.bar-colors::before{mix-blend-mode:soft-light;opacity:.8;animation:barcolors calc(var(--bars,3s)*3) linear infinite;animation-delay:var(--d,0s)}
.ln.bar-slide{animation:barslide calc(var(--bars,3s)*3) ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes barsheen{from{background-position:150% 0}to{background-position:-50% 0}}
@keyframes barstripes{to{background-position:56px 0}}
@keyframes barbreathe{0%,100%{opacity:0}50%{opacity:.3}}
@keyframes barblink{0%,70%,100%{opacity:0}80%{opacity:.6}90%{opacity:.1}}
@keyframes barcolors{0%,100%{background:#ff3b3b}20%{background:#ffd84a}40%{background:#3bff7a}60%{background:#3bc8ff}80%{background:#b03bff}}
@keyframes barslide{0%{transform:translateX(-105%)}12%,82%{transform:none}95%,100%{transform:translateX(105%)}}

.banner{position:relative}
.fx-float{animation:bfloat var(--bs,3s) ease-in-out infinite}
.fx-glow{animation:bglow var(--bs,3s) ease-in-out infinite}
.fx-rainbow{animation:brain calc(var(--bs,3s)*1.5) linear infinite}
.fx-pulse{animation:bpulse var(--bs,3s) ease-in-out infinite}
.fx-sweep::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);animation:bsweep var(--bs,3s) ease-in-out infinite;pointer-events:none}
.fx-inout{animation:binout calc(var(--bs,3s)*3) ease-in-out infinite}
.fx-shake{animation:bshake calc(var(--bs,3s)*1.2) ease-in-out infinite}
@keyframes bfloat{50%{transform:translateY(-8px)}}
@keyframes bglow{50%{box-shadow:0 0 28px 6px rgba(255,160,40,.95)}}
@keyframes brain{0%,100%{box-shadow:0 0 0 5px #ff3b3b,0 0 20px #ff3b3b}20%{box-shadow:0 0 0 5px #ffd84a,0 0 20px #ffd84a}40%{box-shadow:0 0 0 5px #3bff7a,0 0 20px #3bff7a}60%{box-shadow:0 0 0 5px #3bc8ff,0 0 20px #3bc8ff}80%{box-shadow:0 0 0 5px #b03bff,0 0 20px #b03bff}}
@keyframes bpulse{50%{transform:scale(1.025)}}
@keyframes bsweep{0%{left:-40%}60%,100%{left:120%}}
@keyframes binout{0%{transform:translateX(-110%);opacity:0}12%,85%{transform:none;opacity:1}100%{transform:translateX(110%);opacity:0}}
@keyframes bshake{0%,90%,100%{transform:none}92%{transform:translateX(-6px)}94%{transform:translateX(6px)}96%{transform:translateX(-4px)}98%{transform:translateX(4px)}}
.logo img{animation-duration:var(--bs,3s);animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.lg-float{animation-name:lfloat}.lg-pulse{animation-name:lpulse}.lg-swing{animation-name:lswing}.lg-spin{animation-name:lspin;animation-timing-function:linear!important}
@keyframes lfloat{50%{transform:translateY(-6px)}}
@keyframes lpulse{50%{transform:scale(1.12)}}
@keyframes lswing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes lspin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
.wavefx .slide.on .c{animation:wave 1.4s ease-in-out infinite;animation-delay:calc(var(--i)*70ms)}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-24%)}}

.c{display:inline-block;white-space:pre}
.slide.on .c{animation:pop .55s both;animation-delay:calc(var(--i)*35ms)}
@keyframes pop{0%{opacity:0;transform:translateY(70%) scale(.4)}70%{transform:translateY(-12%) scale(1.15)}100%{opacity:1;transform:none}}
.slide span{display:inline-block}
.slide.typing{transition:none}.cr::after{content:"";display:inline-block;width:.09em;height:1em;background:currentColor;margin-left:.12em;vertical-align:-.12em;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.l3.pulse span{animation:pulse 2.4s ease-in-out infinite}
@keyframes sheen{to{background-position:-200% 0}}
@keyframes pulse{50%{opacity:.55;transform:scale(1.03)}}
.panel{display:none;max-width:1000px;margin:14px auto 0;background:var(--card);padding:12px;border-radius:8px}
.panel summary{cursor:pointer;font-weight:700;font-size:17px}
.panel h4{margin:16px 0 4px;color:#ff7a00}
.panel label{display:block;margin:8px 0 3px;font-size:14px}
.panel input[type=text],.panel input[type=number],.panel textarea,.panel select{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid #888;border-radius:6px;background:var(--card);color:var(--fg)}
.panel input[type=color]{width:56px;height:40px;padding:0;border:1px solid #888;border-radius:6px;background:none}
.panel input[type=range]{width:100%}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.row label{margin:8px 0 0}
.chk{display:flex!important;align-items:center;gap:8px}
.panel button{margin-top:14px;padding:12px 18px;font-size:16px;border:0;border-radius:6px;background:#ff7a00;color:#fff;font-weight:700}
.panel button.sec{background:#666;margin-left:8px}
#msg{margin-top:10px;font-size:14px}
.hint{font-size:12px;opacity:.7}
</style>
</head>

<script>

  if(o&&o.banners){for(var id in o.banners){if(ALL.banners[id])mix(ALL.banners[id],o.banners[id]);}

  else mix(ALL.banners["1"],o);
  if(!panel){curId=ALL.live;C=ALL.banners[curId];}
}
function ghInfo(){var h=location.hostname;if(!/\.github\.io$/.test(h))return null;var owner=h.split(".")[0];
  var seg=location.pathname.split("/").filter(Boolean)[0];if(!seg||/\.html?$/.test(seg))seg=owner+".github.io";return {owner:owner,repo:seg};}

}

function msgs(txt,date){return String(txt||"").split("\n").map(function(x){return x.trim();}).filter(Boolean).map(function(x){return x.replace(/\{DATE\}/g,date);});}
function mkLine(cls,list,h,fs,fg,bg){
  var d=el("div","ln "+cls);d.style.height=h;d.style.fontSize=fs;d.style.color=fg;d.style.background=bg;d.style.backgroundSize="200% 100%";
  var sl=list.map(function(t){var s=el("div","slide"),sp=el("span",null,(C.anim.fx==="letters"||C.anim.fx==="wave")?"":t);if(C.anim.fx==="letters"||C.anim.fx==="wave"){Array.from(t).forEach(function(ch,q){var c=el("span","c",ch===" "?"\u00a0":ch);c.style.setProperty("--i",q);sp.appendChild(c);});}s.appendChild(sp);d.appendChild(s);return s;});
  return {box:d,slides:sl,i:0,m:list};
}
function fit(L){
  L.slides.forEach(function(s){var sp=s.firstChild;s.style.fontSize="";
    var cw=L.box.clientWidth-12,sw=sp.offsetWidth;
    if(cw>0&&sw>cw){var fs=parseFloat(getComputedStyle(s).fontSize);s.style.fontSize=(fs*cw/sw)+"px";}});

function mkTicker(date,g1,H,FS){
  var all=msgs(C.l1.slides,date).concat(msgs(C.l2.slides,date),msgs(C.l3.slides,date));
  var d=el("div","ln l1"+(C.anim.shine?" shine":""));d.style.height=H(C.l1.size,2.4);d.style.fontSize=FS(C.l1.size*1.15);
  d.style.color=C.l1.fg;d.style.background=g1;d.style.backgroundSize="200% 100%";

}
function renderBanner(){
  if(banner)banner.remove();
  clearInterval(timer);clearInterval(clk);gen++;var myGen=gen;
  banner=el("div","banner lay-"+(C.layout||"bars")+(C.anim.banner&&C.anim.banner!=="none"?" fx-"+C.anim.banner:"")+(C.anim.fx==="wave"?" wavefx":""));banner.style.setProperty("--bs",(C.anim.bsecs||3)+"s");banner.style.setProperty("--bars",(C.anim.barsecs||3)+"s");
  var s=banner.style, f=FX[C.anim.fx]||FX.up;
  s.setProperty("--enter",f[0]);s.setProperty("--leave",f[1]);s.setProperty("--cin",f[2]||"inset(0)");s.setProperty("--cout",f[3]||"inset(0)");s.setProperty("--fin",f[4]||"none");s.setProperty("--fout",f[5]||"none");s.setProperty("--shine",C.anim.shineSecs+"s");
  if(C.logo.show&&C.logo.src){

    lg.appendChild(im);banner.appendChild(lg);}
  var rest=el("div","rest");
  var date=(C.l2.date||"").trim()||nextSunday();
  function H(z,k){return "clamp("+(z*k*.45)+"px,"+(z*k)+"vw,"+(z*k*10)+"px)";}
  function FS(z){return "clamp(7px,"+z+"vw,"+(z*10)+"px)";}
  var g1="linear-gradient(90deg,"+C.l1.bg1+","+C.l1.bg2+","+C.l1.bg1+")";

    mkLine("l1"+(C.anim.shine?" shine":""),msgs(C.l1.slides,date),H(C.l1.size,2.1),FS(C.l1.size),C.l1.fg,g1),

    if(!x.slides.length)return;
    var p=x.slides[x.i];
    if(x.slides.length===1){p.classList.remove("on");p.classList.add("out");setTimeout(function(){p.classList.remove("out");void p.offsetWidth;p.classList.add("on");},750);return;}
    p.classList.remove("on");p.classList.add("out");
    x.i=(x.i+1)%x.slides.length;var n=x.slides[x.i];n.classList.remove("out");void n.offsetWidth;n.classList.add("on");
    setTimeout(function(){p.classList.remove("out");},800);
  }
  if(max>=1){timer=setInterval(function(){
    L.forEach(function(x,k){setTimeout(function(){swap(x);},k*(C.anim.stagger||0));});
  },Math.max(1.5,C.anim.secs)*1000);}
  window.onresize=function(){L.forEach(fit);};
}

/* ---------- editor panel ---------- */
var panel;
function field(parent,label,type,get,set,extra){
  var l=el("label",null,label),i;
  if(type==="textarea"){i=el("textarea");i.rows=3;}
  else if(type==="select"){i=el("select");extra.forEach(function(o){var op=el("option",null,o[1]);op.value=o[0];i.appendChild(op);});}
  else{i=el("input");i.type=type;if(extra){for(var k in extra)i.setAttribute(k,extra[k]);}}
  if(type==="checkbox"){l.className="chk";i.checked=!!get();i.onchange=function(){set(i.checked);renderBanner();};l.insertBefore(i,l.firstChild);parent.appendChild(l);return;}
  i.value=get();
  var h=function(){var v=i.value;if(type==="number"||type==="range")v=parseFloat(v)||0;set(v);renderBanner();};
  i.oninput=h;i.onchange=h;
  l.appendChild(i);parent.appendChild(l);
}
function colorRow(parent,items){var r=el("div","row");items.forEach(function(it){field(r,it[0],"color",it[1],it[2]);});parent.appendChild(r);}

function rebuildPanel(){if(panel){panel.remove();panel=null;}buildPanel();try{panel.scrollIntoView();}catch(e){}}
function buildPanel(){

  pl.appendChild(pi);panel.appendChild(pl);panel.appendChild(pb);
  var ids=Object.keys(ALL.banners).sort(),bo=ids.map(function(i){return [i,"Banner "+i];});

  field(panel,"Banner LIVE on the stream (same link)","select",function(){return ALL.live;},function(v){ALL.live=v;upd();},bo);
  upd();panel.appendChild(ln);
  field(panel,"Banner style (layout)","select",function(){return C.layout||"bars";},function(v){C.layout=v;},[["bars","Three bars with logo on the left"],["tv","TV style: logo card, two bars, clock and small tag"],["person","Person: photo and name (speaker)"],["pill","Rounded pill"],["card","Tall card with big logo on top"],["ticker","Scrolling ticker (one moving line)"]]);
  field(panel,"Ticker speed (pixels per second)","number",function(){return C.anim.tickerSpeed;},function(v){C.anim.tickerSpeed=v;},{min:20,max:400,step:10});
  field(panel,"TV style: small tag at top right (empty = hide)","text",function(){return C.tag||"";},function(v){C.tag=v;});
  field(panel,"TV style: show clock","checkbox",function(){return !!C.clock;},function(v){C.clock=v;});
  C.photo=C.photo||{src:""};
  var pf=el("label",null,"Person style: picture of the person (cropped to fit)"),pin=el("input");pin.type="file";pin.accept="image/*";
  pin.onchange=function(){var f=pin.files&&pin.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){var im=new Image();im.onload=function(){
      var tw=320,th=400,sc=Math.max(tw/im.width,th/im.height),w=im.width*sc,hh=im.height*sc,cv=document.createElement("canvas");
      cv.width=tw;cv.height=th;var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,tw,th);cx.drawImage(im,(tw-w)/2,(th-hh)/3,w,hh);
      C.photo={src:cv.toDataURL("image/jpeg",.85)};renderBanner();};im.src=r.result;};
    r.readAsDataURL(f);};
  pf.appendChild(pin);panel.appendChild(pf);
  var rb=el("button","sec","Remove picture");rb.onclick=function(){C.photo={src:""};renderBanner();};panel.appendChild(rb);
  panel.appendChild(el("div","hint","Person style: line 1 = the name, line 2 = title or role, line 3 = bottom line."));
  panel.appendChild(el("div","hint","Ticker style joins the messages of all three lines into one moving line."));
  var h;
  h=el("h4",null,"Line 1 (top)");panel.appendChild(h);
  field(panel,"Messages (one per line, shown in turn)","textarea",function(){return C.l1.slides;},function(v){C.l1.slides=v;});
  colorRow(panel,[["Colour A","",0],["Colour B","",0],["Text","",0]].map(function(x,i){var k=["bg1","bg2","fg"][i];return [x[0],function(){return C.l1[k];},function(v){C.l1[k]=v;}];}));
  field(panel,"Text size","range",function(){return C.l1.size;},function(v){C.l1.size=v;},{min:1,max:5,step:.1});

  panel.appendChild(el("h4",null,"Line 2 (changing line)"));
  field(panel,"Messages (one per line, shown in turn). Type {DATE} for the Sunday date","textarea",function(){return C.l2.slides;},function(v){C.l2.slides=v;});
  field(panel,"Date words (leave empty = automatic coming Sunday)","text",function(){return C.l2.date;},function(v){C.l2.date=v;});
  colorRow(panel,[["Background",function(){return C.l2.bg;},function(v){C.l2.bg=v;}],["Text",function(){return C.l2.fg;},function(v){C.l2.fg=v;}]]);
  field(panel,"Text size","range",function(){return C.l2.size;},function(v){C.l2.size=v;},{min:1,max:5,step:.1});

  panel.appendChild(el("h4",null,"Line 3 (bottom)"));
  field(panel,"Messages (one per line, shown in turn)","textarea",function(){return C.l3.slides;},function(v){C.l3.slides=v;});
  colorRow(panel,[["Background",function(){return C.l3.bg;},function(v){C.l3.bg=v;}],["Text",function(){return C.l3.fg;},function(v){C.l3.fg=v;}]]);
  field(panel,"Text size","range",function(){return C.l3.size;},function(v){C.l3.size=v;},{min:1,max:4,step:.1});

  panel.appendChild(el("h4",null,"Animation"));
  field(panel,"Effect for all lines","select",function(){return C.anim.fx;},function(v){C.anim.fx=v;},[["type","Delete then type (typewriter)"],["wave","Letters wave up and down"],["drop","Drop in from top"],["rotate","Rotate and zoom"],["skew","Skew slide"],["letters","Letters pop in one by one"],["flip","Flip"],["wipe","Wipe across"],["blur","Blur in and out"],["up","Slide up"],["side","Slide from side"],["fade","Fade"],["zoom","Zoom"]]);
  field(panel,"Typing speed (milliseconds per letter, smaller = faster)","number",function(){return C.anim.typeMs;},function(v){C.anim.typeMs=v;},{min:10,max:200,step:5});
  field(panel,"Seconds each message stays (90 = 1.5 minutes)","number",function(){return C.anim.secs;},function(v){C.anim.secs=v;},{min:2,max:600,step:1});
  field(panel,"Bar animation (the 3 coloured bars)","select",function(){return C.anim.bars;},function(v){C.anim.bars=v;},[["none","None"],["sheen","Shine moving across each bar"],["stripes","Moving stripes"],["breathe","Breathing light"],["blink","Flash"],["colors","Colour changing"],["slide","Bars slide in and out"]]);
  field(panel,"Bar speed (seconds per cycle, smaller = faster)","number",function(){return C.anim.barsecs;},function(v){C.anim.barsecs=v;},{min:1,max:20,step:.5});
  field(panel,"Whole banner animation","select",function(){return C.anim.banner;},function(v){C.anim.banner=v;},[["none","None"],["sweep","Light sweep across"],["glow","Glowing"],["rainbow","Rainbow border"],["float","Floating"],["pulse","Pulse (grow and shrink)"],["inout","Slide in and out"],["shake","Shake every now and then"]]);
  field(panel,"Whole banner speed (seconds per cycle, smaller = faster)","number",function(){return C.anim.bsecs;},function(v){C.anim.bsecs=v;},{min:1,max:20,step:.5});
  field(panel,"Delay between lines in milliseconds (0 = all together)","number",function(){return C.anim.stagger;},function(v){C.anim.stagger=v;},{min:0,max:2000,step:100});
  field(panel,"Moving shine on line 1","checkbox",function(){return C.anim.shine;},function(v){C.anim.shine=v;});
  field(panel,"Shine speed (seconds, smaller = faster)","number",function(){return C.anim.shineSecs;},function(v){C.anim.shineSecs=v;},{min:1,max:20,step:.5});
  field(panel,"Pulse on line 3","checkbox",function(){return C.anim.pulse;},function(v){C.anim.pulse=v;});

  panel.appendChild(el("h4",null,"Logo"));
  field(panel,"Logo animation","select",function(){return C.logo.anim;},function(v){C.logo.anim=v;},[["none","None"],["float","Floating"],["pulse","Pulse"],["swing","Swing"],["spin","Spin around"]]);
  field(panel,"Show logo","checkbox",function(){return C.logo.show;},function(v){C.logo.show=v;});
  field(panel,"Logo size","range",function(){return C.logo.size;},function(v){C.logo.size=v;},{min:5,max:25,step:.5});
  var lab=el("label",null,"Change logo (pick a picture)"),fi=el("input");fi.type="file";fi.accept="image/*";
  fi.onchange=function(){var f=fi.files&&fi.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){var im=new Image();im.onload=function(){
      var sc=Math.min(1,320/Math.max(im.width,im.height)),cv=document.createElement("canvas");
      cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);
      var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
      C.logo.src=cv.toDataURL("image/jpeg",.85);C.logo.show=true;renderBanner();};im.src=r.result;};

  var m=el("div",null,"");m.id="msg";
  if(window.claude&&claude.use){
    var b=el("button",null,"Save banner");b.onclick=save;panel.appendChild(b);panel.appendChild(m);
    panel.appendChild(el("div","hint","Changes show here at once. Press Save so the stream (Prism) shows them too."));
  }else{
    var tl=el("label",null,"GitHub token (one time, stays on this phone only)"),ti=el("input");ti.type="text";ti.placeholder="github_pat_...";
    try{ti.value=localStorage.getItem("ghtok")||"";}catch(e){}
    ti.onchange=function(){try{localStorage.setItem("ghtok",ti.value.trim());}catch(e){}};
    tl.appendChild(ti);panel.appendChild(tl);
    var b2=el("button",null,"Save online");
    b2.onclick=async function(){
      var gi=ghInfo();
      if(!gi){m.textContent="Open this page from your GitHub Pages link (name.github.io/...) to save.";return;}
      var tok=ti.value.trim();if(!tok){m.textContent="Paste your GitHub token first.";return;}
      try{localStorage.setItem("ghtok",tok);}catch(e){}
      m.textContent="Saving...";
      var api="https://api.github.com/repos/"+gi.owner+"/"+gi.repo+"/contents/config.json";
      var H={Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"};
      try{
        var g=await fetch(api,{headers:H,cache:"no-store"}),sha;
        if(g.ok){sha=(await g.json()).sha;}
        var body={message:"Update banner",content:btoa(unescape(encodeURIComponent(JSON.stringify(ALL))))};
        if(sha)body.sha=sha;
        var p=await fetch(api,{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},H),body:JSON.stringify(body)});
        m.textContent=p.ok?"Saved online. The stream shows it within about 2 minutes.":"Could not save (error "+p.status+"). Check the token.";
      }catch(e){m.textContent="Could not save. Check your internet.";}
    };
    panel.appendChild(b2);panel.appendChild(m);
    panel.appendChild(el("div","hint","Press Save online. The Prism link stays the same and updates by itself."));
  }
  app.appendChild(panel);
}
async function save(){
  var m=document.getElementById("msg");
  if(!ART){m.textContent="Saving is not available here. Open this page in Claude to save.";return;}
  try{
    var clone=document.documentElement.cloneNode(true);
    clone.querySelector("#app").innerHTML="";
    clone.querySelector("#cfg").textContent=JSON.stringify(ALL).replace(/</g,"\\u003c");
    m.textContent="Saving...";
    await ART.publish("<!DOCTYPE html>\n"+clone.outerHTML);
  }catch(e){m.textContent="Could not save ("+(e&&e.code?e.code:"error")+"). Only the owner can save.";}
}
